name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      kroki:
        image: yuzutech/kroki:latest
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,llm]"
      - run: python -m pytest -q
        env:
          KROKI_URL: http://localhost:8000
      - run: python n8n/build_workflows.py && git diff --exit-code n8n/workflows

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t docsync:ci .
      - run: docker run --rm docsync:ci docsync --help
