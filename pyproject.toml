[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsync"
version = "1.0.0"
description = "DocSync: автоактуализация документации системного анализа в Confluence по изменениям кода в GitLab"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "jinja2>=3.1",
  "jsonschema>=4.20",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
docsync = "docsync.cli:main"

[tool.setuptools.packages.find]
include = ["docsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
